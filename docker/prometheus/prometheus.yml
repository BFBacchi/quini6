global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'quini6-backend'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['172.25.32.1:8082']
        labels:
          application: 'quini6-analytics'

  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'grafana'
    static_configs:
      - targets: ['host.docker.internal:3001']
