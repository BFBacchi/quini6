# ══════════════════════════════════════════════════════════
# Quini6 Analytics — Spring Boot Configuration
# ══════════════════════════════════════════════════════════

spring:
  application:
    name: quini6-analytics

  # ─── Datasource (PostgreSQL) ──────────────────────────
  datasource:
    url: jdbc:postgresql://localhost:5434/quini6
    username: quini6
    password: quini6_dev_2026
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 30000
      connection-timeout: 20000

  # ─── JPA / Hibernate ──────────────────────────────────
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        default_batch_fetch_size: 16
        jdbc:
          batch_size: 25
        order_inserts: true
        order_updates: true

  # ─── Flyway ───────────────────────────────────────────
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  # ─── Elasticsearch ────────────────────────────────────
  elasticsearch:
    uris: http://localhost:9200

  # ─── RabbitMQ ─────────────────────────────────────────
  rabbitmq:
    host: localhost
    port: 5672
    username: quini6
    password: quini6_dev_2026
    listener:
      simple:
        acknowledge-mode: manual
        prefetch: 10
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 1000

  # ─── Jackson ──────────────────────────────────────────
  jackson:
    serialization:
      write-dates-as-timestamps: false
    default-property-inclusion: non_null
    deserialization:
      fail-on-unknown-properties: false

# ─── Server ─────────────────────────────────────────────
server:
  port: 8082
  servlet:
    context-path: /

# ─── SpringDoc OpenAPI ───────────────────────────────────
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  api-docs:
    path: /v3/api-docs
  packages-to-scan: com.quini6.analytics.controller

# ─── Actuator ───────────────────────────────────────────
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized
  metrics:
    export:
      prometheus:
        enabled: true
    tags:
      application: quini6-analytics

# ─── Resilience4j ──────────────────────────────────────
resilience4j:
  retry:
    instances:
      quini6Api:
        max-attempts: 3
        wait-duration: 2s
        retry-exceptions:
          - java.io.IOException
          - java.net.ConnectException
          - org.springframework.web.client.ResourceAccessException
  circuitbreaker:
    instances:
      quini6Api:
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-interval-function-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 3

# ─── JWT ────────────────────────────────────────────────
jwt:
  secret: dev-only-change-in-prod-256bit-key-here
  expiration-ms: 86400000

# ─── External APIs ──────────────────────────────────────
quini6:
  api:
    primary-url: http://localhost:5000
    secondary-url: https://node-quini6.onrender.com
    endpoints:
      sorteos: /v1/q6r/sorteos
      sorteo: /v1/q6r/sorteo/{numeroSorteo}
      todoslosnumeros: /v1/q6r/todoslosnumeros

# ─── Logging ────────────────────────────────────────────
logging:
  level:
    root: INFO
    com.quini6.analytics: INFO
    org.hibernate.SQL: WARN
    org.flywaydb: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
