apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: true

  - name: Elasticsearch
    type: elasticsearch
    access: proxy
    url: http://host.docker.internal:9200
    database: "quini6-*"
    jsonData:
      esVersion: "8.14.0"
      timeField: "@timestamp"
      logMessageField: message
      logLevelField: level
    editable: true
