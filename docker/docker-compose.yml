# ══════════════════════════════════════════════════════════
# Quini6 Analytics — Base Compose (Production-Local)
# Usage: docker compose --env .env up --build
# ══════════════════════════════════════════════════════════

services:
  # ─── PostgreSQL 16 ─────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: q6-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-quini6}
      POSTGRES_USER: ${POSTGRES_USER:-quini6}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-quini6_dev_2026}
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "${POSTGRES_HOST_PORT:-5434}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-quini6} -d ${POSTGRES_DB:-quini6}"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ─── Elasticsearch 8.x ────────────────────────────────
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.14.0
    container_name: q6-elasticsearch
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - xpack.security.http.ssl.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ports:
      - "${ELASTICSEARCH_PORT:-9200}:9200"
    volumes:
      - esdata:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=5s || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15

  # ─── RabbitMQ 3.x ────────────────────────────────────
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: q6-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-quini6}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-quini6_dev_2026}
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_MGMT_PORT:-15672}:15672"
    volumes:
      - rabbitmqdata:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_running"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ─── Backend (Spring Boot) ────────────────────────────
  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
      target: production
    container_name: q6-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-docker}
      SPRING_DATASOURCE_URL: jdbc:postgresql://${POSTGRES_HOST:-postgres}:${POSTGRES_PORT:-5432}/${POSTGRES_DB:-quini6}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-quini6}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-quini6_dev_2026}
      SPRING_ELASTICSEARCH_URIS: http://${ELASTICSEARCH_HOST:-elasticsearch}:${ELASTICSEARCH_PORT:-9200}
      SPRING_RABBITMQ_HOST: ${RABBITMQ_HOST:-rabbitmq}
      SPRING_RABBITMQ_PORT: ${RABBITMQ_PORT:-5672}
      SPRING_RABBITMQ_USERNAME: ${RABBITMQ_USER:-quini6}
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-quini6_dev_2026}
      JWT_SECRET: ${JWT_SECRET:-dev-only-change-in-prod-256bit-key-here}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-86400000}
      QUINI6_API_PRIMARY: ${QUINI6_API_PRIMARY:-http://host.docker.internal:5000}
      QUINI6_API_SECONDARY: ${QUINI6_API_SECONDARY:-https://node-quini6.onrender.com}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin123}
    ports:
      - "${BACKEND_PORT:-8082}:8082"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8082/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ─── Frontend ─────────────────────────────────────────
  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
      target: production
    container_name: q6-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy

  # ─── pgAdmin (debug profile) ──────────────────────────
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: q6-pgadmin
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@quini6.dev
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    profiles:
      - debug

  # ─── Prometheus ───────────────────────────────────────
  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: q6-prometheus
    restart: unless-stopped
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - promdata:/prometheus
    ports:
      - "9090:9090"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.retention.time=30d'
      - '--web.enable-lifecycle'
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9090/-/healthy"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Grafana ──────────────────────────────────────────
  grafana:
    image: grafana/grafana:11.1.0
    container_name: q6-grafana
    restart: unless-stopped
    depends_on:
      prometheus:
        condition: service_healthy
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: 'false'
      GF_SERVER_ROOT_URL: 'http://localhost:3001'
      GF_INSTALL_PLUGINS: ''
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafdata:/var/lib/grafana
    ports:
      - "3001:3000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Kibana ───────────────────────────────────────────
  kibana:
    image: docker.elastic.co/kibana/kibana:8.14.0
    container_name: q6-kibana
    restart: unless-stopped
    depends_on:
      elasticsearch:
        condition: service_healthy
    environment:
      ELASTICSEARCH_HOSTS: http://${ELASTICSEARCH_HOST:-elasticsearch}:${ELASTICSEARCH_PORT:-9200}
      SERVER_NAME: quini6-kibana
    ports:
      - "5601:5601"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:5601/api/status | grep -q '\"overall\"' || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 60s

volumes:
  pgdata:
  esdata:
  rabbitmqdata:
  promdata:
  grafdata:
